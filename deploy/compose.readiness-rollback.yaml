name: browser-mcp-readiness-rollback

# Disposable rollback exercise. Volumes are deliberately project-specific and
# never shared with browser-mcp-local or the DemoQA test project.
services:
  browser:
    image: ${READINESS_BROWSER_IMAGE:-browser-mcp-demoqa-browser:test}
    pull_policy: never
    init: true
    mem_limit: 2816m
    memswap_limit: 2816m
    cpus: 2.0
    pids_limit: 512
    shm_size: 256m
    restart: "no"
    tmpfs:
      - /run/readiness-secrets:mode=0700
    volumes:
      - worker_state:/app/runtime/worker-state
    environment:
      READINESS_WORKER_KEY: ${READINESS_WORKER_KEY:?generated by readiness_rollback.ps1}
      WORKER_API_KEY_FILE: /run/readiness-secrets/key
      WORKER_DATA_DIR: /app/runtime/worker-state
      BROWSER_BACKEND: camoufox
      BROWSER_HEADLESS: "false"
      EGRESS_READY: "true"
      ROUTE_GENERATION: "1"
      PROXY_ASSIGNMENT_ID: readiness-rollback
      APP_ENV: test
    entrypoint: ["sh", "-c"]
    command:
      - 'printf %s "$$READINESS_WORKER_KEY" > /run/readiness-secrets/key; unset READINESS_WORKER_KEY; exec xvfb-run -a -s "-screen 0 1440x1000x24" python -m worker.app --host 0.0.0.0 --port 7070'
    networks: [readiness_net]

  control:
    image: ${READINESS_CONTROL_IMAGE:-browser-mcp-demoqa-control:test}
    pull_policy: never
    init: true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    restart: "no"
    tmpfs:
      - /run/readiness-secrets:mode=0700
    volumes:
      - control_state:/app/runtime/control-data
    environment:
      READINESS_WORKER_KEY: ${READINESS_WORKER_KEY:?generated by readiness_rollback.ps1}
      WORKER_API_KEY_FILE: /run/readiness-secrets/key
      BROWSER_MCP_DATA_DIR: /app/runtime/control-data
      BROWSER_MCP_ORIGIN: http://localhost:18081
      BROWSER_MCP_OPERATOR_AUTH: local
      BROWSER_MCP_UI_DIR: /app/ui
      MODEL_BASE_URL: http://host.docker.internal:8080/v1
      MODEL_ALIAS: auto
      MODEL_PROTOCOL: generic
      BROWSER_WORKER_URL: http://browser:7070
    entrypoint: ["sh", "-c"]
    command:
      - 'printf %s "$$READINESS_WORKER_KEY" > /run/readiness-secrets/key; unset READINESS_WORKER_KEY; exec python -m browser_mcp.cli --host 0.0.0.0 --port 8080'
    ports:
      - "127.0.0.1:18081:8080"
    networks: [readiness_net, model_net]
    depends_on: [browser]

networks:
  readiness_net:
    internal: true
  model_net: {}

volumes:
  control_state:
    name: browser-mcp-readiness-rollback-control-state
  worker_state:
    name: browser-mcp-readiness-rollback-worker-state
