# Opt-in deployment overlay for the reviewed readiness candidate.
# Keep the existing project name, external credentials volume, named state
# volumes, ports, aliases, and direct-egress overlay from the base files.
services:
  control:
    image: browser-mcp-antibot-control:prompt-3184fb4
    pull_policy: never

  browser:
    image: browser-mcp-remediation-browser:ebay-assets-b437221
    pull_policy: never
    mem_limit: 4096m
    memswap_limit: 4096m
    environment:
      BROWSER_OBSERVATION_HINTS: "1"
      BROWSER_MEMORY_MAINTENANCE: "1"
