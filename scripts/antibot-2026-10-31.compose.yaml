name: browser-mcp-antibot-2026-10-31

services:
  browser:
    image: browser-mcp-readiness-browser:candidate
    pull_policy: never
    init: true
    mem_limit: 2816m
    memswap_limit: 2816m
    cpus: 2.0
    pids_limit: 512
    shm_size: 256m
    restart: "no"
    tmpfs:
      - /run/antibot-secrets:mode=0700
    volumes:
      - worker_state:/app/runtime/worker-state
    environment:
      READINESS_WORKER_KEY: ${ANTIBOT_WORKER_KEY:?fresh test-only key required}
      WORKER_API_KEY_FILE: /run/antibot-secrets/key
      WORKER_DATA_DIR: /app/runtime/worker-state
      BROWSER_BACKEND: camoufox
      BROWSER_HEADLESS: "false"
      BROWSER_OBSERVATION_HINTS: "1"
      BROWSER_MEMORY_MAINTENANCE: "1"
      EGRESS_READY: "true"
      ROUTE_GENERATION: "1"
      PROXY_ASSIGNMENT_ID: antibot-2026-10-31-direct
      APP_ENV: test
      READINESS_DISPOSABLE: "1"
      READINESS_ACTION_TRACE: "1"
    entrypoint: ["sh", "-c"]
    command:
      - 'printf %s "$$READINESS_WORKER_KEY" > /run/antibot-secrets/key; unset READINESS_WORKER_KEY; exec xvfb-run -a -s "-screen 0 1440x1000x24" python -m worker.app --host 0.0.0.0 --port 7070'
    networks: [readiness_net, browser_direct_uplink]

  control:
    image: browser-mcp-antibot-control:prompt-3184fb4
    pull_policy: never
    init: true
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2.0
    pids_limit: 128
    restart: "no"
    tmpfs:
      - /run/antibot-secrets:mode=0700
      - /app/runtime/control-data:mode=0700
    environment:
      READINESS_WORKER_KEY: ${ANTIBOT_WORKER_KEY:?fresh test-only key required}
      WORKER_API_KEY_FILE: /run/antibot-secrets/key
      BROWSER_MCP_DATA_DIR: /app/runtime/control-data
      BROWSER_MCP_ORIGIN: http://localhost:18081
      BROWSER_MCP_OPERATOR_AUTH: local
      BROWSER_MCP_UI_DIR: /app/ui
      MODEL_BASE_URL: http://host.docker.internal:8080/v1
      MODEL_ALIAS: auto
      MODEL_PROTOCOL: generic
      BROWSER_WORKER_URL: http://browser:7070
      APP_ENV: test
      READINESS_DISPOSABLE: "1"
    entrypoint: ["sh", "-c"]
    command:
      - 'printf %s "$$READINESS_WORKER_KEY" > /run/antibot-secrets/key; unset READINESS_WORKER_KEY; exec python -m browser_mcp.cli --host 0.0.0.0 --port 8080'
    ports:
      - "127.0.0.1:18081:8080"
    networks: [readiness_net, viewer_uplink]
    depends_on: [browser]

networks:
  readiness_net:
    internal: true
  browser_direct_uplink: {}
  viewer_uplink: {}

volumes:
  control_state:
    name: browser-mcp-antibot-2026-10-31-control-state
  worker_state:
    name: browser-mcp-antibot-2026-10-31-worker-state-p2
